; samc.ini - configuracion del plugin en el LABORATORIO (todavia no usar en el juego real)
[laboratorio]
; Carpeta "GTA San Andreas User Files" propia del laboratorio (relativa a este archivo)
carpeta_usuario=..\UserFiles
; Prueba automatica: espera a que aparezca el jugador, espera, mide y cierra el juego
prueba=1
espera_s=25
medicion_s=30
cerrar_al_terminar=1
carpeta_resultados=..\..\resultados
etiqueta=prueba
; Durante la prueba, quitar el limitador de FPS para medir lo que da el motor
sin_limitador=1
; Solo en un jugador (sin SA-MP): saltar los videos y empezar partida nueva sola
saltar_intro=1
partida_nueva_auto=1
