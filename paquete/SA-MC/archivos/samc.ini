; samc.ini - opciones de SA:MC (GTA San Andreas 1.0 US, un jugador y SA-MP 0.3.7)
; Cada opcion: 1 = encendida, 0 = apagada. Si algo falla, apaga la ultima que cambiaste y avisa.
; Options: 1 = on, 0 = off (see README.txt for the English description).
[samc]

; ---- Dibujo en otro nucleo del procesador
; Las ordenes para la tarjeta de video se preparan en el nucleo del juego y se entregan desde otro nucleo.
intermediario_d3d=1
hilo_dibujo=1
; Direct3D 9 sobre Vulkan (DXVK, incluido en la carpeta dxvk). Para usar el Direct3D de siempre, pon un ;
; delante de la linea (sin DXVK funciona igual, un poco mas lento con muchos autos cerca).
d3d9_dll=dxvk\d3d9.dll

; ---- Autos
; Autos iguales dibujados "en bola" (una sola orden para todos los de un mismo modelo). 0 = apagado.
juntar_autos=2
; Autos a mas de 150 m sin ruedas (a esa distancia miden 1 o 2 pixeles). 0 = las dibuja siempre.
ruedas_lejanas_m=150
; Posiciones de las piezas de los autos calculadas en varios nucleos. 0 = apagado.
piezas_paralelo=2
; Brillo del reflejo una vez por modelo y no una vez por auto (mismo resultado). 0 = apagado.
reflejo_una_vez=1

; ---- Muchos jugadores (SA-MP)
; El juego trae 3000 "referencias" (lo que cada persona recuerda de quien tiene cerca). Con muchos
; jugadores se agotan y el juego se traba buscandolas. Se agregan estas. 0 = como el original.
referencias_extra=30000
; El sonido de Windows (DirectSound) lee el registro en cada cambio de sonido: se recuerda lo leido.
atajo_sonido=1
; SA-MP pide permisos de memoria repetidos para cada jugador en cada cuadro: se responden sin preguntar
; a Windows. Si un servidor con anticheat en tu PC se queja, ponlo en 0.
atajo_samp=1
; Choques de personas y autos: se descartan antes las pruebas que el juego igual iba a rechazar (mismo
; resultado, comprobado en millones de pruebas). 0 = como el original.
choques_rapidos=1
; El sonido (volumen, frecuencia y reproduccion de los 48 canales de DirectSound) se entrega desde otro
; nucleo mientras el juego dibuja. 0 = en el nucleo del juego, como el original.
sonido_hilo=1

; ---- Personas y efectos en varios nucleos
; La pose de los huesos de cada persona (la parte cara de su animacion) se calcula en varios nucleos.
; Mismo resultado, comprobado byte a byte en mas de 2 millones de animaciones. 0 = como el original.
animacion_paralelo=1
; Efectos (fuego, humo, agua): el juego recalculaba en cada cuadro los nombres de 13 sonidos por cada
; efecto encendido; ahora se calculan una sola vez (mismo resultado). 0 = como el original.
efectos_sonido=1
; Las particulas de los efectos se mueven en varios nucleos (las que usan azar, agua o el mundo siguen
; en el nucleo del juego). Mismo resultado, comprobado byte a byte. 0 = como el original.
efectos_paralelo=1

; ---- Diagnostico
; Anota en samc.log, por cada minuto de juego, los FPS (promedio, bajones y el peor cuadro) y cuantos
; autos y personas habia cerca. Sirve para comparar y para avisar si algo anda mal. 0 = no anotar.
registro_fps=1
